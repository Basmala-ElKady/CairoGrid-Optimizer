name: Cairo Smart City CI Pipeline

# Controls when the workflow will run
on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code from GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Python Environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install Dependencies (if you have a requirements.txt)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Set PYTHONPATH
      # This ensures the script can find the 'Backend' package
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      # 5. Execute your Pipeline Script
      - name: Run Automation Pipeline
        run: python .github/workflows/pipeline.py
        