version: '3.8'

services:
  # Python Backend / Simulation Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1

  # Frontend Nginx Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    volumes:
      - ./Frontend:/usr/share/nginx/html
